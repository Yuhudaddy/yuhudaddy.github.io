<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yuhudaddy — Apps</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1c1c1e;
    --muted: #6e6e73;
    --link: #0a84ff;
    --rule: #e5e5ea;
    --card: #f5f5f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --fg: #f2f2f7;
      --muted: #9a9a9e;
      --link: #5ac8fa;
      --rule: #2a2a2c;
      --card: #1c1c1e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
      "Hiragino Sans", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 24px;
    text-align: center;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 32px;
    letter-spacing: -0.02em;
  }
  .subtitle {
    color: var(--muted);
    margin: 0 0 48px;
  }
  .app-card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    text-align: left;
    transition: transform 0.15s ease;
  }
  .app-card:hover {
    transform: translateY(-2px);
  }
  .app-card h2 {
    margin: 0 0 6px;
    font-size: 18px;
  }
  .app-card p {
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 14px;
  }
  .app-card .links a {
    color: var(--link);
    text-decoration: none;
    font-size: 14px;
    margin-right: 16px;
  }
  .app-card .links a:hover {
    text-decoration: underline;
  }
  footer {
    margin-top: 48px;
    color: var(--muted);
    font-size: 13px;
  }
  footer a {
    color: var(--muted);
    text-decoration: none;
  }
  footer a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<main>
  <h1>yuhudaddy</h1>
  <p class="subtitle">Independent apps from Taiwan.</p>

  <div class="app-card">
    <h2>Tier List Maker</h2>
    <p>Build, drag, and rank — a tier list app for iOS &amp; Android.</p>
    <div class="links">
      <a href="./privacy/tier-list-maker.html">Privacy Policy</a>
    </div>
  </div>

  <footer>
    <a href="mailto:h10840206@gmail.com">h10840206@gmail.com</a>
  </footer>
</main>
</body>
</html>
